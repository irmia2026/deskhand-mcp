[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deskhand-mcp"
version = "0.1.0"
description = "Windows 桌面操控 MCP server（host-as-VL 架构）：确定性三级定位 + 精确界面读写，视觉判断交回主模型"
readme = "README.md"
license = { text = "AGPL-3.0-only" }
requires-python = ">=3.10"
authors = [{ name = "irmia2026" }]
keywords = ["mcp", "computer-use", "uiautomation", "windows", "automation", "gui-agent"]
dependencies = [
    "mcp>=2.0",
    "pywin32",
    "Pillow",
    "uiautomation",
]

[project.optional-dependencies]
# 本地 OCR 通道（二选一，winsdk 优先、rapidocr 兜底；都不装则 OCR 通道静默关闭）
ocr = ["winsdk"]
rapidocr = ["rapidocr-onnxruntime"]
# CV 候选框检测（look 的第三通道：图标/自绘控件）
cv = ["opencv-python-headless"]
# WGC 窗口画面抓取（后台/被遮挡窗口的像素验证）
wgc = ["windows-capture"]
all = ["winsdk", "rapidocr-onnxruntime", "opencv-python-headless", "windows-capture"]

[project.scripts]
deskhand-mcp = "deskhand_mcp.server:main"

[project.urls]
Homepage = "https://github.com/irmia2026/deskhand-mcp"

[tool.hatch.build.targets.wheel]
packages = ["deskhand_mcp"]
